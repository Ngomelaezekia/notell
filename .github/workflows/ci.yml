name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: notell_test
          POSTGRES_PASSWORD: notell_test
          POSTGRES_DB: notell_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notell_test -d notell_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NOTELL_TEST_DATABASE_URL: host=localhost user=notell_test password=notell_test dbname=notell_test port=5432 sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Synchronize Go modules
        run: go mod tidy

      - name: Verify module graph
        run: go mod tidy -diff

      - name: Verify dependencies
        run: go mod verify

      - name: Test
        run: go test -mod=readonly ./...

      - name: Build
        run: go build -mod=readonly ./...
