name: Temporary user search repair
on:
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair search query
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/handlers/user.go')
          s=p.read_text()
          old='''\tfollowingExpr:="EXISTS (SELECT 1 FROM user_relationships ur WHERE ur.follower_id = ? AND ur.following_id = users.id AND ur.status = 'accepted')"\n\tselectExpr:=gorm.Expr("users.id, users.username, users.profile_picture, users.cover_picture, users.bio, users.country, users.city, users.status, users.allow_followers, users.created_at, "+followingExpr+" AS following",viewerID)\n\terr:=base.Table("users").Select(selectExpr).Order(orderRank).Order("username ASC").Order("id ASC").Offset((page-1)*limit).Limit(limit).Find(&users).Error;if err!=nil{c.JSON(http.StatusInternalServerError,gin.H{"message":"database error"});return};c.JSON(http.StatusOK,gin.H{"data":gin.H{"users":users,"pagination":gin.H{"page":page,"limit":limit,"total":total,"hasMore":int64(page*limit)<total}}})'''
          new='''\terr:=base.Select("id, username, profile_picture, cover_picture, bio, country, city, status, allow_followers, created_at").Order(orderRank).Order("username ASC").Order("id ASC").Offset((page-1)*limit).Limit(limit).Find(&users).Error;if err!=nil{c.JSON(http.StatusInternalServerError,gin.H{"message":"database error"});return}\n\tif len(users)>0 { ids:=make([]uint,len(users)); for i:=range users { ids[i]=users[i].ID }; var relationships []models.Relationship; if err:=h.DB.Where("follower_id = ? AND following_id IN ? AND status = ?",viewerID,ids,"accepted").Find(&relationships).Error; err!=nil { c.JSON(http.StatusInternalServerError,gin.H{"message":"database error"}); return }; following:=make(map[uint]struct{},len(relationships)); for _,r:=range relationships { following[r.FollowingID]=struct{}{} }; for i:=range users { _,users[i].Following=following[users[i].ID] } }\n\tc.JSON(http.StatusOK,gin.H{"data":gin.H{"users":users,"pagination":gin.H{"page":page,"limit":limit,"total":total,"hasMore":int64(page*limit)<total}}})'''
          if old not in s: raise SystemExit('target search query not found')
          p.write_text(s.replace(old,new,1))
          PY
          gofmt -w backend/handlers/user.go
          git diff --check
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/handlers/user.go
          git commit -m "backend: fix user search database query"
          git push origin main
