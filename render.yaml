services:
  - type: web
    name: notell
    runtime: go
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: go mod tidy && go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /api/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: notels05
          property: host
      - key: DB_PORT
        fromDatabase:
          name: notels05
          property: port
      - key: DB_USER
        fromDatabase:
          name: notels05
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: notels05
          property: password
      - key: DB_NAME
        fromDatabase:
          name: notels05
          property: database
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URL
        sync: false
      - key: FRONTEND_URL
        value: https://notell-web.onrender.com
      - key: SERVER_URL
        value: https://notell.onrender.com
      - key: MEDIA_PUBLIC_URL
        sync: false
      - key: STORAGE_DRIVER
        value: b2
      - key: B2_ENDPOINT
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_REGION
        sync: false

  - type: web
    name: music
    runtime: go
    rootDir: music
    plan: free
    region: singapore
    buildCommand: go mod tidy && go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://notell-web.onrender.com

  - type: web
    name: channel
    runtime: go
    rootDir: services/channel
    plan: free
    region: singapore
    buildCommand: go mod tidy && go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CHANNEL_INTERNAL_SERVICE_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://notell-web.onrender.com

  - type: web
    name: message
    runtime: go
    rootDir: services/message
    plan: free
    region: singapore
    buildCommand: go mod tidy && go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://notell-web.onrender.com
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

  - type: web
    name: live
    runtime: go
    rootDir: services/live
    plan: free
    region: singapore
    buildCommand: go mod tidy && go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: notell-live-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://notell-web.onrender.com
      - key: CHANNEL_SERVICE_URL
        sync: false
      - key: PAYMENT_SERVICE_URL
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false

  - type: web
    name: payment
    runtime: go
    rootDir: services/payment
    plan: free
    region: singapore
    buildCommand: go mod tidy && go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://notell-web.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: static
    name: notell-web
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_SERVER_URL
        value: https://notell.onrender.com
      - key: VITE_API_URL
        value: https://notell.onrender.com/api

databases:
  - name: notels05
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: notelldb
    user: notellusers

  - name: notell-live-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: notelllive
    user: notelllive

# Channel, Message, Live, and Payment are independent application services.
# Live owns stream state and receives identity through the shared Notell JWT contract.
# Payment owns subscription state; channel/live integrate through stable IDs and service contracts.
# No Docker/Kubernetes configuration is used.
