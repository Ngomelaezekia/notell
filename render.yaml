services:
  - type: web
    name: notell
    runtime: go
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: go mod tidy && go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /api/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URL
        sync: false
      - key: FRONTEND_URL
        value: https://notell-web.onrender.com
      - key: SERVER_URL
        value: https://notell.onrender.com
      - key: MUSIC_SERVICE_URL
        value: https://music-unnd.onrender.com
      - key: MEDIA_PUBLIC_URL
        sync: false
      - key: STORAGE_DRIVER
        value: b2
      - key: B2_ENDPOINT
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_REGION
        sync: false
  - type: web
    name: music
    runtime: go
    rootDir: music
    plan: free
    region: singapore
    buildCommand: go mod tidy && go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://notell-web.onrender.com
      - key: MUSIC_PROVIDER
        value: 7digital
      # External PostgreSQL (Neon free tier). Keep the service architecture unchanged.
      # Set this secret in Render to the Neon pooled connection string.
      - key: MUSIC_DATABASE_URL
        sync: false
      - key: MUSIC_TRENDS_STORE
        value: postgres
      - key: MUSIC_RIGHTS_SYNC_ENABLED
        value: "true"
      - key: MUSIC_EVENT_INGEST_KEY
        sync: false
      - key: MUSIC_MASSIVE_CONSUMER_KEY
        sync: false
      - key: MUSIC_MASSIVE_CONSUMER_SECRET
        sync: false
      - key: MUSIC_MASSIVE_ACCESS_TOKEN
        sync: false
      - key: MUSIC_MASSIVE_ACCESS_TOKEN_SECRET
        sync: false
      - key: MUSIC_MASSIVE_FORMAT_ID
        sync: false
      - key: MUSIC_RIGHTS_SYNC_KEY
        sync: false
      - key: MUSIC_COUNTRY
        value: TZ
      - key: MUSIC_MAX_SEGMENT_SECONDS
        value: "60"
  - type: web
    name: channel
    runtime: go
    rootDir: services/channel
    plan: free
    region: singapore
    buildCommand: go mod tidy && go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CHANNEL_INTERNAL_SERVICE_KEY
        sync: false
      - key: PAYMENT_SERVICE_URL
        value: https://payment-u3hq.onrender.com
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://notell-web.onrender.com
  - type: web
    name: message
    runtime: go
    rootDir: services/message
    plan: free
    region: singapore
    buildCommand: go mod tidy && go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://notell-web.onrender.com
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
  - type: web
    name: live
    runtime: go
    rootDir: services/live
    plan: free
    region: singapore
    buildCommand: go mod tidy && go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://notell-web.onrender.com
      - key: PAYMENT_SERVICE_URL
        value: https://payment-u3hq.onrender.com
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: CHANNEL_SERVICE_URL
        value: https://channel-g90c.onrender.com
      - key: CHANNEL_INTERNAL_SERVICE_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
  - type: web
    name: payment
    runtime: go
    rootDir: services/payment
    plan: free
    region: singapore
    buildCommand: go mod tidy && go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://notell-web.onrender.com
      - key: PUBLIC_APP_URL
        value: https://notell-web.onrender.com
      - key: GIFT_ADMIN_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PKG_STARTER
        sync: false
      - key: STRIPE_PRICE_PKG_CREATOR
        sync: false
      - key: STRIPE_PRICE_PKG_PRO
        sync: false
      - key: STRIPE_PRICE_PKG_247
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: SUBSCRIPTION_SUCCESS_URL
        sync: false
      - key: SUBSCRIPTION_CANCEL_URL
        sync: false
  - type: static
    name: notell-web
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_SERVER_URL
        value: https://notell.onrender.com
      - key: VITE_API_URL
        value: https://notell.onrender.com/api
      - key: VITE_MUSIC_SERVICE_URL
        value: https://music-unnd.onrender.com
      - key: VITE_MUSIC_COUNTRY
        value: TZ
      - key: VITE_CHANNEL_SERVICE_URL
        value: https://channel-g90c.onrender.com
      - key: VITE_MESSAGE_SERVICE_URL
        value: https://message-yinu.onrender.com
      - key: VITE_LIVE_SERVICE_URL
        value: https://live-m1qg.onrender.com
      - key: VITE_PAYMENT_SERVICE_URL
        value: https://payment-u3hq.onrender.com

