services:
  - type: web
    name: notell
    runtime: go
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: go mod tidy && go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /api/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: notels05
          property: host
      - key: DB_PORT
        fromDatabase:
          name: notels05
          property: port
      - key: DB_USER
        fromDatabase:
          name: notels05
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: notels05
          property: password
      - key: DB_NAME
        fromDatabase:
          name: notels05
          property: database
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URL
        sync: false
      - key: FRONTEND_URL
        value: https://notell-web.onrender.com
      - key: SERVER_URL
        value: https://notell.onrender.com
      - key: MEDIA_PUBLIC_URL
        sync: false
      - key: STORAGE_DRIVER
        value: b2
      - key: B2_ENDPOINT
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_REGION
        sync: false

  - type: static
    name: notell-web
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_SERVER_URL
        value: https://notell.onrender.com
      - key: VITE_API_URL
        value: https://notell.onrender.com/api

databases:
  - name: notels05
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: notelldb
    user: notellusers
